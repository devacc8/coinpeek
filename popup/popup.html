<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinPeek - Bitcoin Price Badge & Gas Tracker</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-title">
                <h1>CoinPeek</h1>
            </div>
            <div class="header-controls">
                <button class="refresh-btn" id="refresh-btn" data-i18n-title="refreshTitle" data-i18n-aria="refreshAria">↻</button>
                <div class="updated-info">
                    <span class="updated-text"><span data-i18n="updatedLabel">updated</span> <span id="last-updated" data-i18n="neverLabel">never</span></span>
                    <span class="status-dot" id="status-dot"></span>
                </div>
            </div>
        </header>

        <main class="main-content">
            <!-- Price Display Section -->
            <section class="price-section">
                
                <div class="price-grid">
                    <div class="price-card" id="btc-card" role="article" data-i18n-aria="bitcoinPriceAria">
                        <div class="price-header">
                            <div class="coin-icon coin-icon-btc" role="img" data-i18n-aria="bitcoinIconAria"></div>
                            <span class="coin-name" data-i18n="bitcoinName">Bitcoin</span>
                            <span class="coin-symbol">BTC</span>
                        </div>
                        <div class="price-row">
                            <div class="price-value" id="btc-price">$--,---</div>
                            <div class="price-change" id="btc-change">--%</div>
                        </div>
                        <div class="gas-fees-inline">
                            <span class="gas-label" data-i18n="networkFees">Network fees:</span>
                            <span class="gas-values">
                                <span id="btc-gas-low">--</span> | 
                                <span id="btc-gas-standard">--</span> | 
                                <span id="btc-gas-fast">--</span> sat/vB
                            </span>
                        </div>
                    </div>

                    <div class="price-card" id="eth-card" role="article" data-i18n-aria="ethereumPriceAria">
                        <div class="price-header">
                            <div class="coin-icon coin-icon-eth" role="img" data-i18n-aria="ethereumIconAria"></div>
                            <span class="coin-name" data-i18n="ethereumName">Ethereum</span>
                            <span class="coin-symbol">ETH</span>
                        </div>
                        <div class="price-row">
                            <div class="price-value" id="eth-price">$--,---</div>
                            <div class="price-change" id="eth-change">--%</div>
                        </div>
                        <div class="gas-fees-inline">
                            <span class="gas-label" data-i18n="networkFees">Network fees:</span>
                            <span class="gas-values">
                                <span id="eth-gas-low">--</span> | 
                                <span id="eth-gas-standard">--</span> | 
                                <span id="eth-gas-fast">--</span> gwei
                            </span>
                        </div>
                    </div>
                </div>
            </section>


            <!-- Converter Section -->
            <section class="converter-section" data-i18n-aria="converterAria">
                <div class="converter-header">
                    <h2 data-i18n="quickConvert">Quick Convert</h2>
                    <button class="converter-arrow" id="swap-currencies" data-i18n-aria="swapCurrencies" data-i18n-title="swapCurrencies">⇄</button>
                </div>
                <div class="converter-form-compact">
                    <div class="converter-row">
                        <label for="from-currency" class="visually-hidden" data-i18n="fromCurrency">From currency</label>
                        <select id="from-currency" class="coin-select-compact" data-i18n-aria="sourceCurrency">
                            <option value="bitcoin" data-i18n="bitcoinName">Bitcoin</option>
                            <option value="ethereum" data-i18n="ethereumName">Ethereum</option>
                            <option value="usd" data-i18n="usdLabel">USD</option>
                        </select>
                        <label for="from-amount" class="visually-hidden" data-i18n="amountToConvert">Amount to convert</label>
                        <input type="number" id="from-amount" placeholder="0" step="0.00000001" min="0" data-i18n-aria="amountToConvert">
                    </div>
                    <div class="converter-row">
                        <label for="to-currency" class="visually-hidden" data-i18n="toCurrency">To currency</label>
                        <select id="to-currency" class="coin-select-compact" data-i18n-aria="targetCurrency">
                            <option value="usd" data-i18n="usdLabel">USD</option>
                            <option value="bitcoin" data-i18n="bitcoinName">Bitcoin</option>
                            <option value="ethereum" data-i18n="ethereumName">Ethereum</option>
                        </select>
                        <label for="to-amount" class="visually-hidden" data-i18n="convertedAmount">Converted amount</label>
                        <input type="number" id="to-amount" placeholder="0" readonly data-i18n-aria="convertedAmount" aria-readonly="true">
                    </div>
                </div>
            </section>
        </main>

    </div>

    <script src="../config/constants.js"></script>
    <script src="../utils/i18n.js"></script>
    <script src="../utils/formatters.js"></script>
    <script src="popup.js"></script>
</body>
</html>
